[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "contextyield"
version = "0.2.0"
description = "Evidence-aware AI routing and whole-task agent efficiency analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.9,<3",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
nvml = ["nvidia-ml-py>=12.560,<14"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "pytest-cov>=6,<8"]

[project.scripts]
contextyield = "contextyield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["contextyield"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["EXE002", "SIM117"]
